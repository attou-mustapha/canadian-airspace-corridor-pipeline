[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canadian-airspace-corridor-pipeline"
version = "0.1.0"
description = "3D flight corridor spatial validation and obstacle indexing pipeline using High-Resolution Digital Elevation Models (HRDEM) and PostGIS 3D."
readme = "README.md"
authors = [
    { name = "Mustapha ATTOU", email = "attou.mustapha.pro@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.9",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0"
]

[project.scripts]
airspace-corridor = "airspace_pipeline.cli:main"
